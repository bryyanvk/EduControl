spring.application.name=back-end

gemini.api.key=${GEMINI_API_KEY:}

# Recuperação de senha por e-mail (SMTP). Defina as variáveis de ambiente
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME e SPRING_MAIL_PASSWORD
# para o envio funcionar. Sem SMTP o código não é enviado.
educontrol.mail.remetente=${EDUCONTROL_MAIL_REMETENTE:}
# Somente para testes locais: escreve o código no log do servidor quando não há SMTP.
educontrol.mail.logar-codigo=${EDUCONTROL_LOGAR_CODIGO:false}

# Aceita conexões de outros equipamentos da rede (o leitor RFID acessa por 172.16.30.20:8080).
server.address=0.0.0.0
server.port=8080

# Token do leitor RFID (cabeçalho X-Device-Token). Vazio = POST /edu/rfid fica aberto, sem token.
educontrol.dispositivo.token=${EDUCONTROL_DEVICE_TOKEN:}